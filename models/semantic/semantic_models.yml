semantic_models:
  - name: order_items
    description: One row per order item (fct_order_items).
    model: ref('fct_order_items')
    defaults:
      agg_time_dimension: purchase_date
    entities:
      - name: order_item
        type: primary
        expr: order_item_key
      - name: order
        type: foreign
        expr: order_id
      - name: person
        type: foreign
        expr: customer_unique_id
    dimensions:
      - name: purchase_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical
    measures:
      - name: item_price_sum
        description: Sum of item price, freight excluded.
        agg: sum
        expr: price
      - name: freight_sum
        description: Sum of freight charged on items.
        agg: sum
        expr: freight_value
  - name: orders
    description: One row per order, all statuses (fct_orders).
    model: ref('fct_orders')
    defaults:
      agg_time_dimension: purchase_date
    entities:
      - name: order
        type: primary
        expr: order_id
      - name: person
        type: foreign
        expr: customer_unique_id
    dimensions:
      - name: purchase_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical
    measures:
      - name: order_count
        description: Distinct orders.
        agg: count_distinct
        expr: order_id
  - name: customers
    description: One row per person (fct_customers).
    model: ref('fct_customers')
    defaults:
      agg_time_dimension: first_order_date
    entities:
      - name: person
        type: primary
        expr: customer_unique_id
    dimensions:
      - name: first_order_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: repeat_customer_sum
        description: People with 2 or more delivered orders.
        agg: sum
        expr: is_repeat_customer
      - name: delivered_customer_sum
        description: People with at least 1 delivered order.
        agg: sum
        expr: has_delivered_order

metrics:
  - name: completed_revenue
    label: Completed revenue
    description: Item price (freight excluded) on orders with status delivered.
    type: simple
    type_params:
      measure: item_price_sum
    filter: |
      {{ Dimension('order_item__order_status') }} = 'delivered'
  - name: freight_total
    label: Freight total
    description: Freight charged on orders with status delivered.
    type: simple
    type_params:
      measure: freight_sum
    filter: |
      {{ Dimension('order_item__order_status') }} = 'delivered'
  - name: completed_orders
    label: Completed orders
    description: Number of distinct orders with status delivered.
    type: simple
    type_params:
      measure: order_count
    filter: |
      {{ Dimension('order__order_status') }} = 'delivered'
  - name: orders_placed
    label: Orders placed
    description: Number of distinct orders of any status.
    type: simple
    type_params:
      measure: order_count
  - name: repeat_customers
    label: Repeat customers
    description: People with 2 or more delivered orders.
    type: simple
    type_params:
      measure: repeat_customer_sum
  - name: customers_with_delivered_order
    label: Customers with a delivered order
    description: People with at least 1 delivered order.
    type: simple
    type_params:
      measure: delivered_customer_sum
  - name: repeat_purchase_rate
    label: Repeat purchase rate
    description: Repeat customers divided by customers with a delivered order.
    type: ratio
    type_params:
      numerator: repeat_customers
      denominator: customers_with_delivered_order
